<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Início - Cifras Igreja</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar('inicio')}"></div>

<main class="container py-4">

    <div class="card shadow-sm">
        <div class="card-body">

            <h2 class="h5 mb-3">Próximo Evento</h2>

            <div th:if="${proximoEvento == null}" class="text-center text-muted py-4">
                Nenhum evento futuro cadastrado.
            </div>

            <div th:if="${proximoEvento != null}">

                <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
                    <div>
                        <h3 class="h5 mb-1" th:text="${proximoEvento.nome}">
                            Culto de Domingo
                        </h3>

                        <div class="text-muted small">
                            <span th:text="${#temporals.format(proximoEvento.data, 'dd/MM/yyyy')}"></span>

                            <span th:if="${proximoEvento.horario != null}">
                                -
                                <span th:text="${#temporals.format(proximoEvento.horario, 'HH:mm')}"></span>
                            </span>
                        </div>
                    </div>

                    <a th:href="${basePath + '/calendario/' + proximoEvento.id}"
                       class="btn btn-outline-primary btn-sm">
                        Abrir
                    </a>
                </div>

                <hr>

                <h4 class="h6 mb-3">Músicas</h4>

                <div th:if="${#lists.isEmpty(proximoEvento.repertorio)}" class="text-muted">
                    Nenhuma música adicionada a este evento.
                </div>

                <div th:if="${!#lists.isEmpty(proximoEvento.repertorio)}" class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Música</th>
                            <th>Tom</th>
                            <th class="text-center">▶</th>
                            <th class="text-center">♫</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="item : ${proximoEvento.repertorio}">
                            <td th:text="${item.ordem}"></td>

                            <td style="max-width: 140px;">
                                <div class="fw-semibold small lh-sm text-break"
                                     th:text="${item.musica.nome}">
                                </div>

                                <div th:if="${item.musica.cantor != null && !item.musica.cantor.isBlank()}"
                                     class="text-muted small lh-sm mt-1 text-break"
                                     th:text="${item.musica.cantor}">
                                </div>
                            </td>

                            <td>
                                <span th:if="${item.musica.tom != null && !item.musica.tom.isBlank()}"
                                      class="fw-semibold"
                                      th:text="${item.musica.tom}">
                                </span>

                                <span th:if="${item.musica.tom == null || item.musica.tom.isBlank()}"
                                      class="text-muted">
                                    -
                                </span>
                            </td>

                            <td class="text-center">
                                <a th:if="${item.musica.linkYoutube != null && !item.musica.linkYoutube.isBlank()}"
                                   th:href="${item.musica.linkYoutube}"
                                   target="_blank"
                                   class="btn btn-outline-danger btn-sm"
                                   title="Abrir YouTube"
                                   aria-label="Abrir YouTube">
                                    ▶
                                </a>

                                <span th:if="${item.musica.linkYoutube == null || item.musica.linkYoutube.isBlank()}"
                                      class="text-muted">
                                    -
                                </span>
                            </td>

                            <td class="text-center">
                                <a th:if="${item.musica.caminhoArquivoCifra != null && !item.musica.caminhoArquivoCifra.isBlank()}"
                                   th:href="${basePath + item.musica.caminhoArquivoCifra}"
                                   target="_blank"
                                   class="btn btn-outline-primary btn-sm"
                                   title="Abrir cifra"
                                   aria-label="Abrir cifra">
                                    ♫
                                </a>

                                <span th:if="${item.musica.caminhoArquivoCifra == null || item.musica.caminhoArquivoCifra.isBlank()}"
                                      class="text-muted">
                                    -
                                </span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

            </div>

        </div>
    </div>

</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
