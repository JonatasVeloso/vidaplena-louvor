<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Músicas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>
        .music-title {
            max-width: 380px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            line-height: 1.2;
        }

        .music-key {
            font-weight: 600;
            white-space: nowrap;
        }

        .icon-action {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            padding: 0;
            line-height: 1;
        }

        .icon-disabled {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #adb5bd;
            border: 1px solid #dee2e6;
            border-radius: .375rem;
            background-color: #f8f9fa;
        }

        @media (max-width: 767px) {
            .table {
                font-size: 0.74rem;
            }

            .music-title {
                max-width: 105px;
                font-size: 0.72rem;
                line-height: 1.06;
                -webkit-line-clamp: 2;
            }

            .music-key {
                font-size: 0.72rem;
            }

            .icon-action,
            .icon-disabled {
                width: 28px;
                height: 28px;
                font-size: 0.86rem;
            }

            .music-actions {
                white-space: nowrap;
            }

            main.container {
                padding-left: 0.3rem;
                padding-right: 0.3rem;
            }

            .card-body {
                padding: 0.45rem;
            }

            th,
            td {
                padding: 0.28rem !important;
            }

            h1.h3 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar('musicas')}"></div>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h3 mb-0">Músicas</h1>

        <a th:href="${basePath + '/musicas/nova'}" class="btn btn-primary btn-sm">
            Nova Música
        </a>
    </div>

    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <form method="get" th:action="${basePath + '/musicas'}" class="row g-2">
                <div class="col-12 col-md-10">
                    <input type="text"
                           name="busca"
                           class="form-control"
                           placeholder="Buscar música..."
                           th:value="${busca}">
                </div>

                <div class="col-12 col-md-2 d-grid">
                    <button class="btn btn-outline-primary" type="submit">
                        Buscar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div th:if="${#lists.isEmpty(musicas)}" class="text-center text-muted py-4">
                Nenhuma música cadastrada.
            </div>

            <div th:if="${!#lists.isEmpty(musicas)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Tom</th>
                        <th class="text-center">▶</th>
                        <th class="text-center">♫</th>
                        <th class="text-center">✎</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="musica : ${musicas}">
                        <td>
                            <div class="fw-semibold lh-sm" th:text="${musica.nome}"></div>

                            <div th:if="${musica.cantor != null && !musica.cantor.isBlank()}"
                                 class="text-muted small lh-sm mt-1"
                                 th:text="${musica.cantor}">
                            </div>
                        </td>

                        <td>
                            <span th:if="${musica.tom != null && !musica.tom.isBlank()}"
                                  class="music-key"
                                  th:text="${musica.tom}">
                            </span>

                            <span th:if="${musica.tom == null || musica.tom.isBlank()}"
                                  class="text-muted">
                                -
                            </span>
                        </td>

                        <td class="text-center music-actions">
                            <a th:if="${musica.linkYoutube != null && !musica.linkYoutube.isBlank()}"
                               th:href="${musica.linkYoutube}"
                               target="_blank"
                               class="btn btn-outline-danger btn-sm icon-action"
                               title="Abrir YouTube"
                               aria-label="Abrir YouTube">
                                ▶
                            </a>

                            <span th:if="${musica.linkYoutube == null || musica.linkYoutube.isBlank()}"
                                  class="icon-disabled"
                                  title="Sem YouTube">
                                ▶
                            </span>
                        </td>

                        <td class="text-center music-actions">
                            <a th:if="${musica.caminhoArquivoCifra != null && !musica.caminhoArquivoCifra.isBlank()}"
                               th:href="${basePath + musica.caminhoArquivoCifra}"
                               target="_blank"
                               class="btn btn-outline-primary btn-sm icon-action"
                               title="Abrir cifra"
                               aria-label="Abrir cifra">
                                ♫
                            </a>

                            <span th:if="${musica.caminhoArquivoCifra == null || musica.caminhoArquivoCifra.isBlank()}"
                                  class="icon-disabled"
                                  title="Sem cifra">
                                ♫
                            </span>
                        </td>

                        <td class="text-center music-actions">
                            <a th:href="${basePath + '/musicas/' + musica.id + '/editar'}"
                               class="btn btn-outline-secondary btn-sm icon-action"
                               title="Editar música"
                               aria-label="Editar música">
                                ✎
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
