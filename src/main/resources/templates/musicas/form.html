<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicao} ? 'Editar Música' : 'Cadastrar Música'">Cadastrar Música</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar('musicas')}"></div>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h3 mb-0" th:text="${modoEdicao} ? 'Editar Música' : 'Cadastrar Música'">
            Cadastrar Música
        </h1>

        <a th:href="${basePath + '/musicas'}" class="btn btn-outline-secondary btn-sm">
            Voltar
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

            <form th:action="${modoEdicao} ? ${basePath + '/musicas/' + musica.id + '/editar'} : ${basePath + '/musicas'}"
                  th:object="${musica}"
                  method="post"
                  enctype="multipart/form-data">

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome da música *</label>
                    <input type="text"
                           id="nome"
                           th:field="*{nome}"
                           class="form-control"
                           placeholder="">

                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('nome')}"
                         th:errors="*{nome}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="cantor" class="form-label">Cantor</label>
                    <input type="text"
                           id="cantor"
                           th:field="*{cantor}"
                           class="form-control"
                           placeholder="">
                </div>

                <div class="mb-3">
                    <label for="tom" class="form-label">Tom</label>
                    <input type="text"
                           id="tom"
                           th:field="*{tom}"
                           class="form-control"
                           placeholder="Ex: G, A, C#m, Bb">
                </div>

                <div class="mb-3">
                    <label for="linkYoutube" class="form-label">Link do YouTube</label>
                    <input type="url"
                           id="linkYoutube"
                           th:field="*{linkYoutube}"
                           class="form-control"
                           placeholder="">
                </div>

                <div class="mb-3" th:if="${modoEdicao}">
                    <label class="form-label">Cifra atual</label>

                    <div th:if="${musica.caminhoArquivoCifra != null && !musica.caminhoArquivoCifra.isBlank()}">
                        <a th:href="${basePath + musica.caminhoArquivoCifra}"
                           target="_blank"
                           class="btn btn-outline-primary btn-sm">
                            Abrir cifra atual
                        </a>
                    </div>

                    <div th:if="${musica.caminhoArquivoCifra == null || musica.caminhoArquivoCifra.isBlank()}"
                         class="text-muted small">
                        Sem cifra cadastrada.
                    </div>
                </div>

                <div class="mb-4">
                    <label for="arquivoCifra" class="form-label">
                        <span th:text="${modoEdicao} ? 'Nova cifra em PDF' : 'Cifra em PDF'">
                            Cifra em PDF
                        </span>
                    </label>

                    <input type="file"
                           id="arquivoCifra"
                           name="arquivoCifra"
                           class="form-control"
                           accept="application/pdf">
                </div>

                <div class="d-flex justify-content-between align-items-center gap-2">
                    <button type="submit" class="btn btn-primary">
                        <span th:text="${modoEdicao} ? 'Salvar Alterações' : 'Salvar Música'">
                            Salvar Música
                        </span>
                    </button>

                    <button th:if="${modoEdicao}"
                            type="submit"
                            class="btn btn-outline-danger"
                            th:form="'formExcluirMusica'">
                        Apagar
                    </button>
                </div>

            </form>

            <form th:if="${modoEdicao}"
                  th:id="'formExcluirMusica'"
                  th:action="${basePath + '/musicas/' + musica.id + '/excluir'}"
                  method="post"
                  onsubmit="return confirm('Tem certeza que deseja apagar esta música? Ela também será removida dos repertórios onde foi usada.');">
            </form>
        </div>
    </div>

</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
