<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navbar(activePage)" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="${basePath + '/'}">
            Vida Plena
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarPrincipal"
                aria-controls="navbarPrincipal"
                aria-expanded="false"
                aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div id="navbarPrincipal" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${activePage == 'inicio'} ? ' active' : ''"
                       th:href="${basePath + '/'}">
                        Início
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${activePage == 'musicas'} ? ' active' : ''"
                       th:href="${basePath + '/musicas'}">
                        Músicas
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${activePage == 'calendario'} ? ' active' : ''"
                       th:href="${basePath + '/calendario'}">
                        Calendário
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>

</body>
</html>
