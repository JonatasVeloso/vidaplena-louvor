<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${evento.nome}">Evento</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>
        .music-title {
            max-width: 420px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            line-height: 1.2;
        }

        .icon-action {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            padding: 0;
            line-height: 1;
        }

        .icon-disabled {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #adb5bd;
            border: 1px solid #dee2e6;
            border-radius: .375rem;
            background-color: #f8f9fa;
        }

        @media (max-width: 767px) {
            .table {
                font-size: 0.76rem;
            }

            .music-title {
                max-width: 125px;
                font-size: 0.74rem;
                line-height: 1.08;
            }

            .icon-action,
            .icon-disabled {
                width: 28px;
                height: 28px;
                font-size: 0.86rem;
            }

            main.container {
                padding-left: 0.35rem;
                padding-right: 0.35rem;
            }

            .card-body {
                padding: 0.55rem;
            }

            th,
            td {
                padding: 0.34rem !important;
            }

            h1.h3 {
                font-size: 1.15rem;
            }
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="${basePath + '/musicas'}">Cifras Igreja</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div id="navbarPrincipal" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="${basePath + '/musicas'}">Músicas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="${basePath + '/musicas/nova'}">Cadastrar Música</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="${basePath + '/calendario'}">Calendário</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3 gap-2">
        <div>
            <h1 class="h3 mb-1" th:text="${evento.nome}">Evento</h1>

            <div class="text-muted small">
                <span th:text="${#temporals.format(evento.data, 'dd/MM/yyyy')}"></span>

                <span th:if="${evento.horario != null}">
                    -
                    <span th:text="${#temporals.format(evento.horario, 'HH:mm')}"></span>
                </span>
            </div>
        </div>

        <div class="d-flex gap-1">
            <a th:href="${basePath + '/calendario'}" class="btn btn-outline-secondary btn-sm">
                Voltar
            </a>

            <a th:href="${basePath + '/calendario/' + evento.id + '/editar'}" class="btn btn-primary btn-sm">
                Editar
            </a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <h2 class="h5 mb-3">Repertório</h2>

            <div th:if="${#lists.isEmpty(evento.repertorio)}" class="text-center text-muted py-4">
                Nenhuma música adicionada ao evento.
            </div>

            <div th:if="${!#lists.isEmpty(evento.repertorio)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Música</th>
                        <th>Tom</th>
                        <th class="text-center">▶</th>
                        <th class="text-center">♫</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="item : ${evento.repertorio}">
                        <td th:text="${item.ordem}"></td>

                        <td>
                            <strong class="music-title" th:text="${item.musica.nome}"></strong>
                        </td>

                        <td>
                            <span th:if="${item.musica.tom != null && !item.musica.tom.isBlank()}"
                                  th:text="${item.musica.tom}">
                            </span>

                            <span th:if="${item.musica.tom == null || item.musica.tom.isBlank()}"
                                  class="text-muted">
                                -
                            </span>
                        </td>

                        <td class="text-center">
                            <a th:if="${item.musica.linkYoutube != null && !item.musica.linkYoutube.isBlank()}"
                               th:href="${item.musica.linkYoutube}"
                               target="_blank"
                               class="btn btn-outline-danger btn-sm icon-action"
                               title="Abrir YouTube">
                                ▶
                            </a>

                            <span th:if="${item.musica.linkYoutube == null || item.musica.linkYoutube.isBlank()}"
                                  class="icon-disabled"
                                  title="Sem YouTube">
                                ▶
                            </span>
                        </td>

                        <td class="text-center">
                            <a th:if="${item.musica.caminhoArquivoCifra != null && !item.musica.caminhoArquivoCifra.isBlank()}"
                               th:href="${basePath + item.musica.caminhoArquivoCifra}"
                               target="_blank"
                               class="btn btn-outline-primary btn-sm icon-action"
                               title="Abrir cifra">
                                ♫
                            </a>

                            <span th:if="${item.musica.caminhoArquivoCifra == null || item.musica.caminhoArquivoCifra.isBlank()}"
                                  class="icon-disabled"
                                  title="Sem cifra">
                                ♫
                            </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
