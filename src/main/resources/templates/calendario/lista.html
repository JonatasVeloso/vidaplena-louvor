<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Calendário</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>
        @media (max-width: 767px) {
            .table {
                font-size: 0.82rem;
            }

            .btn-sm {
                font-size: 0.72rem;
                padding: 0.2rem 0.35rem;
            }

            main.container {
                padding-left: 0.4rem;
                padding-right: 0.4rem;
            }

            .card-body {
                padding: 0.55rem;
            }

            th,
            td {
                padding: 0.35rem !important;
            }
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="${basePath + '/musicas'}">Cifras Igreja</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div id="navbarPrincipal" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="${basePath + '/musicas'}">Músicas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="${basePath + '/musicas/nova'}">Cadastrar Música</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="${basePath + '/calendario'}">Calendário</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h3 mb-0">Calendário</h1>

        <a th:href="${basePath + '/calendario/novo'}" class="btn btn-primary btn-sm">
            Novo Evento
        </a>
    </div>

    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div th:if="${#lists.isEmpty(eventos)}" class="text-center text-muted py-4">
                Nenhum evento cadastrado.
            </div>

            <div th:if="${!#lists.isEmpty(eventos)}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Data</th>
                        <th>Evento</th>
                        <th>Horário</th>
                        <th class="text-end">Abrir</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="evento : ${eventos}">
                        <td th:text="${#temporals.format(evento.data, 'dd/MM/yyyy')}"></td>

                        <td>
                            <strong th:text="${evento.nome}"></strong>
                            <div class="text-muted small">
                                <span th:text="${#lists.size(evento.repertorio)}"></span>
                                música(s)
                            </div>
                        </td>

                        <td>
                            <span th:if="${evento.horario != null}"
                                  th:text="${#temporals.format(evento.horario, 'HH:mm')}">
                            </span>

                            <span th:if="${evento.horario == null}" class="text-muted">
                                -
                            </span>
                        </td>

                        <td class="text-end">
                            <a th:href="${basePath + '/calendario/' + evento.id}"
                               class="btn btn-outline-primary btn-sm">
                                Abrir
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</main>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
